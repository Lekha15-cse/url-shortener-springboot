<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        button:hover { opacity: 0.9; }

        .result-box {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
            display: none;
        }

        .result-box.show { display: block; }

        .result-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .result-url {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .result-url a {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            word-break: break-all;
        }

        .result-url a:hover { text-decoration: underline; }

        .copy-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            background: #667eea;
            border-radius: 6px;
            white-space: nowrap;
        }

        .error-box {
            background: #fff0f0;
            border: 2px solid #ff4d4d;
            border-radius: 10px;
            padding: 15px 20px;
            color: #cc0000;
            margin-top: 10px;
            display: none;
        }

        .error-box.show { display: block; }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #aaa;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short one instantly</p>

    <!-- Success message from server -->
    <div th:if="${shortUrl}" class="result-box show">
        <div class="result-label">✅ Your short URL is ready:</div>
        <div class="result-url">
            <a th:href="${shortUrl}" th:text="${shortUrl}" target="_blank"></a>
            <button class="copy-btn" onclick="copyUrl()">Copy</button>
        </div>
    </div>

    <!-- Error message from server -->
    <div th:if="${error}" class="error-box show">
        <span th:text="${error}"></span>
    </div>

    <!-- Form -->
    <form action="/shorten-page" method="post" style="margin-top: 25px;">
        <div class="form-group">
            <input type="text" name="fullUrl" placeholder="https://example.com/very/long/url" required />
            <button type="submit">Shorten</button>
        </div>
    </form>

    <div class="footer">Built with Spring Boot + Thymeleaf</div>
</div>

<script>
    function copyUrl() {
        const url = document.querySelector('.result-url a').href;
        navigator.clipboard.writeText(url).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
        });
    }
</script>
</body>
</html>
